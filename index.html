<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Color Wars</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:#0b0e22; color:#fff; font-family:'Baloo 2', system-ui, sans-serif; overflow:hidden; touch-action:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .btn { border:0; border-radius:20px; font-family:inherit; font-weight:800; color:#fff; cursor:pointer; }
  .screen { position:fixed; inset:0; background:rgba(8,10,28,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; text-align:center; z-index:5; }
  .hidden { display:none !important; }
  h1 { font-size:42px; margin:0; line-height:1; letter-spacing:1px; }
  h2 { font-size:20px; margin:10px 0 6px; }
  .swatches { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:560px; }
  .sw { width:52px; height:52px; border-radius:50%; border:4px solid rgba(255,255,255,.2); cursor:pointer; display:flex; align-items:flex-end; justify-content:center; font-size:11px; font-weight:800; padding-bottom:2px; text-shadow:0 1px 2px rgba(0,0,0,.7); }
  .sw.sel { border-color:#fff; transform:scale(1.15); box-shadow:0 0 18px rgba(255,255,255,.5); }
  .levels { display:flex; gap:8px; justify-content:center; }
  .lvl { padding:6px 16px; font-size:18px; background:#333a66; }
  .lvl.sel { background:#fff; color:#111; }
  #go { margin-top:14px; padding:8px 46px; font-size:30px; background:linear-gradient(#22c55e,#16a34a); box-shadow:0 5px 0 #0f5f2c; }
  #go:active { transform:translateY(4px); box-shadow:0 1px 0 #0f5f2c; }
  .legend { margin-top:10px; font-size:14px; opacity:.8; }
  #count { font-size:120px; font-weight:800; line-height:1; text-shadow:0 8px 0 rgba(0,0,0,.4); }
  .vs { font-size:26px; }
  #resultTitle { font-size:54px; line-height:1.05; }
  #resultSub { font-size:20px; opacity:.85; margin-top:6px; }
  .again { margin-top:16px; padding:10px 40px; font-size:26px; background:linear-gradient(#3b82f6,#2563eb); box-shadow:0 5px 0 #1e3a8a; }
  .small { margin-top:10px; padding:6px 22px; font-size:17px; background:#333a66; }
  #rotate { z-index:9; }
  #rotate .phone { font-size:70px; animation:turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%,30% { transform:rotate(0); } 60%,100% { transform:rotate(-90deg); } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="screen" id="menu">
  <h1>COLOR WARS</h1>
  <h2>Pick your color!</h2>
  <div class="swatches" id="swatches"></div>
  <h2>How tough?</h2>
  <div class="levels" id="levels"></div>
  <button class="btn" id="go">PLAY!</button>
  <div class="legend">✨ Pew &nbsp; 🚀 Rockets &nbsp; 💣 Bomb &nbsp; ⚡ Laser &nbsp; ☢️ Nuke &nbsp; ✖️2 More balls</div>
</div>

<div class="screen hidden" id="countdown"><div class="vs" id="vsText"></div><div id="count">3</div></div>

<div class="screen hidden" id="result">
  <div id="resultTitle">YOU WIN!</div>
  <div id="resultSub"></div>
  <button class="btn again" id="again">PLAY AGAIN</button>
  <button class="btn small" id="toMenu">Change color</button>
</div>

<div class="screen hidden" id="rotate">
  <div class="phone">📱</div>
  <h2>Turn your phone sideways!</h2>
  <button class="btn small" id="anyway">Play anyway</button>
</div>

<script>
(() => {
const COLORS = [
  { name:'Red',    c:'#ef4444', d:'#7f1d1d', l:'#fecaca' },
  { name:'Blue',   c:'#3b82f6', d:'#1e3a8a', l:'#bfdbfe' },
  { name:'Green',  c:'#22c55e', d:'#14532d', l:'#bbf7d0' },
  { name:'Yellow', c:'#facc15', d:'#854d0e', l:'#fef9c3' },
  { name:'Purple', c:'#a855f7', d:'#581c87', l:'#e9d5ff' },
  { name:'Orange', c:'#f97316', d:'#7c2d12', l:'#fed7aa' },
  { name:'Pink',   c:'#ec4899', d:'#831843', l:'#fbcfe8' },
  { name:'Teal',   c:'#14b8a6', d:'#134e4a', l:'#99f6e4' },
];
const LEVELS = [ { name:'Easy', aiDrop:2.1 }, { name:'Medium', aiDrop:1.55 }, { name:'Hard', aiDrop:1.2 } ];
const SLOTS = [
  { k:'laser',   icon:'⚡', name:'LASER!',   size:'L' },
  { k:'rockets', icon:'🚀', name:'ROCKETS!', size:'M' },
  { k:'pew',     icon:'✨', name:'PEW PEW!', size:'S' },
  { k:'double',  icon:'✖️2', name:'DOUBLE!', size:'X' },
  { k:'bomb',    icon:'💣', name:'BOMB!',    size:'M' },
  { k:'nuke',    icon:'☢️', name:'NUKE!!',   size:'L' },
];
const SIZE_COL = { S:'#16a34a', M:'#ea580c', L:'#dc2626', X:'#6366f1' };
const SIZE_TXT = { S:'small', M:'MED', L:'BIG', X:'x2' };

// ----- logical layout (landscape) -----
const W = 960, H = 480;
const BW = 210, BH = 480;               // drop boards
const FX0 = BW + 10, FX1 = W - BW - 10; // battlefield x-range
const FC = (FX0 + FX1) / 2;
const BALL_R = 5.5, SLOT_TOP = 392, SLOT_BOT = 470, SLOT_W = BW / SLOTS.length;
const MAX_BALLS = 14, PLAYER_DROP = 1.4, PIECE = 9;
const ME = 0, AI = 1;

let myColor = 1, level = 0, teamColor = [COLORS[1], COLORS[6]];
let boards, objs, shots, particles, debris, popups, beams, confetti;
let running = false, lastT = 0, shake = 0, flash = 0, gameT = 0, totals = [1, 1];
let scale = 1, offX = 0, offY = 0, dpr = 1, ignorePortrait = false;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

// ===== obstacle course (board-local coords; same course on both sides) =====
function makeCourse() {
  return {
    wheels: [ // spinning prong wheels
      { x:58,  y:82,  hub:7, len:30, n:4, w: 2.6, a:0 },
      { x:152, y:82,  hub:7, len:30, n:4, w:-2.6, a:0.7 },
      { x:69,  y:292, hub:6, len:31, n:3, w:-3.2, a:0 },
      { x:141, y:292, hub:6, len:31, n:3, w: 3.2, a:1 },
    ],
    bumpers: [ { x:30, y:155, r:11, f:0 }, { x:105, y:148, r:13, f:0 }, { x:180, y:155, r:11, f:0 } ],
    pegs: [ {x:105, y:40}, {x:70, y:200}, {x:140, y:200} ].concat([1,2,3,4,5].map(i => ({ x:i * SLOT_W, y:372 }))),
    walls: [ // funnels: left wall, centre splitter, right wall
      [0, 196, 58, 242], [105, 206, 80, 242], [105, 206, 130, 242], [BW, 196, 152, 242],
      // small deflector ramps above the slots
      [0, 330, 22, 345], [BW, 330, BW - 22, 345],
    ],
    slider: { y:346, len:54, x:105, t:0 },
  };
}

// ===== battlefield objects =====
function P(lx, ly) { return { lx, ly, alive:true }; }
const BUILD = {
  gear() { const p = [P(0,0)];
    for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI*2; p.push(P(Math.cos(a)*30, Math.sin(a)*30)); }
    for (let i = 0; i < 8; i++)  { const a = i / 8 * Math.PI*2;  p.push(P(Math.cos(a)*16, Math.sin(a)*16)); }
    for (let i = 0; i < 6; i++)  { const a = i / 6 * Math.PI*2 + 0.2; p.push(P(Math.cos(a)*42, Math.sin(a)*42)); }
    return { pieces:p, spin:1.0 }; },
  windmill() { const p = [P(0,0)];
    for (let k = 0; k < 4; k++) { const cx = Math.cos(k*Math.PI/2), sy = Math.sin(k*Math.PI/2);
      for (let i = 1; i <= 5; i++) p.push(P(cx*i*10, sy*i*10));
      p.push(P(cx*50 - sy*10, sy*50 + cx*10)); p.push(P(cx*40 - sy*10, sy*40 + cx*10)); }
    return { pieces:p, spin:0.9 }; },
  tower() { const p = [];
    for (let y = 0; y < 7; y++) for (let x = 0; x < 4; x++) p.push(P((x - 1.5)*10, (y - 3)*10));
    p.push(P(-15, -40)); p.push(P(15, -40)); // battlements
    return { pieces:p, spin:0, motion:'bob', amp:24, freq:1.3 }; },
  orbiter() { const p = [];
    for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) p.push(P(x*10, y*10));
    for (let k = 0; k < 3; k++) { const a = k / 3 * Math.PI*2, cx = Math.cos(a)*42, cy = Math.sin(a)*42;
      [[0,0],[10,0],[-10,0],[0,10],[0,-10]].forEach(([dx,dy]) => p.push(P(cx+dx, cy+dy))); }
    return { pieces:p, spin:1.7 }; },
  slider() { const p = [];
    for (let y = 0; y < 9; y++) for (let x = 0; x < 2; x++) p.push(P((x - 0.5)*10, (y - 4)*10));
    return { pieces:p, spin:0, motion:'slide', amp:68, freq:0.8 }; },
  flower() { const p = [];
    for (let q = -2; q <= 2; q++) for (let r = -2; r <= 2; r++) { if (Math.abs(q + r) > 2) continue;
      p.push(P((q + r/2) * 10.5, r * 9.1)); }
    return { pieces:p, spin:0.6, motion:'circle', amp:18, freq:1.0 }; },
};
const LAYOUT = [ // positions for the LEFT team; right team is mirrored
  { t:'gear',     x:292, y:112 },
  { t:'orbiter',  x:418, y:112 },
  { t:'windmill', x:356, y:270 },
  { t:'slider',   x:462, y:285 },
  { t:'tower',    x:262, y:390 },
  { t:'flower',   x:400, y:405 },
];
function buildObjects() {
  const list = [];
  for (const team of [ME, AI]) for (const L of LAYOUT) {
    const b = BUILD[L.t](), m = team === AI ? -1 : 1;
    b.pieces.forEach(p => p.lx *= m);
    list.push({ team, type:L.t, bx: team === ME ? L.x : 2*FC - L.x, by:L.y, x:0, y:0, ang:0,
      spin:(b.spin || 0) * m, motion:b.motion, amp:b.amp, freq:b.freq, phase: team * 1.3,
      pieces:b.pieces, alive:true, hit:0 });
  }
  return list;
}
function piecePos(o, p) { const c = Math.cos(o.ang), s = Math.sin(o.ang); return { x:o.x + p.lx*c - p.ly*s, y:o.y + p.lx*s + p.ly*c }; }

// ===== menu =====
function buildMenu() {
  const sw = $('swatches'); sw.innerHTML = '';
  COLORS.forEach((col, i) => {
    const d = document.createElement('div');
    d.className = 'sw' + (i === myColor ? ' sel' : ''); d.style.background = col.c; d.textContent = col.name;
    d.onclick = () => { myColor = i; initAudio(); beep(500 + i*60, 0.08, 'triangle'); buildMenu(); };
    sw.appendChild(d);
  });
  const lv = $('levels'); lv.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button');
    b.className = 'btn lvl' + (i === level ? ' sel' : ''); b.textContent = L.name;
    b.onclick = () => { level = i; initAudio(); beep(400, 0.06); buildMenu(); };
    lv.appendChild(b);
  });
}
try { const s = JSON.parse(localStorage.getItem('colorwars3') || '{}'); if (s.c != null) myColor = s.c; if (s.l != null) level = s.l; } catch(e) {}
buildMenu();
$('go').onclick = () => { initAudio(); startCountdown(); };
$('again').onclick = () => { initAudio(); startCountdown(); };
$('toMenu').onclick = () => { $('result').classList.add('hidden'); $('menu').classList.remove('hidden'); buildMenu(); };
$('anyway').onclick = () => { ignorePortrait = true; checkOrientation(); };

function startCountdown() {
  try { localStorage.setItem('colorwars3', JSON.stringify({ c:myColor, l:level })); } catch(e) {}
  const others = COLORS.map((_, i) => i).filter(i => i !== myColor);
  teamColor = [COLORS[myColor], COLORS[others[Math.floor(Math.random() * others.length)]]];
  setupGame();
  $('menu').classList.add('hidden'); $('result').classList.add('hidden');
  const cd = $('countdown'); cd.classList.remove('hidden');
  $('vsText').innerHTML = `<b style="color:${teamColor[ME].c}">${teamColor[ME].name}</b> vs <b style="color:${teamColor[AI].c}">${teamColor[AI].name}</b>`;
  let n = 3;
  const tick = () => {
    if (n > 0) { $('count').textContent = n; beep(440, 0.12, 'square'); n--; setTimeout(tick, 700); }
    else { $('count').textContent = 'GO!'; beep(880, 0.25, 'square');
      setTimeout(() => { cd.classList.add('hidden'); running = true; lastT = performance.now(); requestAnimationFrame(loop); }, 450); }
  };
  tick();
}

function setupGame() {
  boards = [ME, AI].map(team => ({
    team, ox: team === ME ? 0 : W - BW, course: makeCourse(),
    dropX: BW/2, targetX: BW/2, touched:false, sweepT: Math.random()*6,
    dropTimer: 0.3, aiTimer: 0, balls: [], slotFlash: new Array(SLOTS.length).fill(0),
  }));
  objs = buildObjects();
  totals = [ME, AI].map(t => countPieces(t));
  shots = []; particles = []; debris = []; popups = []; beams = []; confetti = [];
  shake = 0; flash = 0; gameT = 0;
  moveObjects(0);
  resize(); draw();
}
function countPieces(team) { let n = 0; for (const o of objs) if (o.team === team) for (const p of o.pieces) if (p.alive) n++; return n; }

// ===== input =====
let holding = false;
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left - offX) / scale, y:(e.clientY - r.top - offY) / scale }; }
function aim(e) {
  const p = toLogical(e);
  if (p.x < BW + 30 && p.y < SLOT_TOP) { const b = boards[ME]; b.touched = true; b.targetX = Math.max(10, Math.min(BW - 10, p.x)); }
}
cv.addEventListener('pointerdown', e => { holding = true; try { cv.setPointerCapture(e.pointerId); } catch(_) {} aim(e); });
cv.addEventListener('pointermove', e => { if (holding) aim(e); });
cv.addEventListener('pointerup', () => holding = false);
cv.addEventListener('pointercancel', () => holding = false);

// ===== loop =====
function loop(t) {
  const dt = Math.max(0, Math.min(0.033, (t - lastT) / 1000)); lastT = t;
  if (running) update(dt);
  updateFx(dt);
  draw();
  if (running || confetti.length || particles.length || debris.length) requestAnimationFrame(loop);
}

function update(dt) {
  gameT += dt;
  for (const b of boards) updateBoard(b, dt);
  moveObjects(dt);
  updateShots(dt);
  for (const bm of beams) bm.life -= dt; beams = beams.filter(b => b.life > 0);
  shake = Math.max(0, shake - dt * 18); flash = Math.max(0, flash - dt * 2);
  const left = [ME, AI].map(t => objs.some(o => o.team === t && o.alive));
  if (!left[ME] || !left[AI]) endGame(left[ME] ? ME : AI);
  else if (gameT > 300) endGame(countPieces(ME) / totals[ME] >= countPieces(AI) / totals[AI] ? ME : AI);
}

// ----- drop boards -----
function updateBoard(b, dt) {
  const C = b.course;
  if (b.team === ME) { if (!b.touched) { b.sweepT += dt; b.targetX = BW/2 + Math.sin(b.sweepT * 0.9) * (BW/2 - 16); } }
  else { b.aiTimer -= dt; if (b.aiTimer <= 0) { b.aiTimer = 1 + Math.random() * 2; b.targetX = 14 + Math.random() * (BW - 28); } }
  b.dropX += (b.targetX - b.dropX) * Math.min(1, dt * 8);
  b.dropTimer -= dt;
  if (b.dropTimer <= 0) { b.dropTimer = b.team === ME ? PLAYER_DROP : LEVELS[level].aiDrop; dropBall(b, b.dropX); }
  for (const bu of C.bumpers) bu.f = Math.max(0, bu.f - dt * 4);
  for (let i = 0; i < b.slotFlash.length; i++) b.slotFlash[i] = Math.max(0, b.slotFlash[i] - dt * 2.5);
  const steps = 6, h = dt / steps;
  for (let s = 0; s < steps; s++) {
    for (const w of C.wheels) w.a += w.w * h;
    C.slider.t += h; const oldX = C.slider.x; C.slider.x = BW/2 + Math.sin(C.slider.t * 1.9) * (BW/2 - C.slider.len/2 - 4);
    C.slider.vx = (C.slider.x - oldX) / h;
    for (const ball of b.balls) if (!ball.done) stepBall(b, ball, h);
  }
  for (const ball of b.balls) {
    ball.age += dt;
    if (Math.hypot(ball.vx, ball.vy) < 20) ball.still += dt; else ball.still = 0;
    if (ball.still > 1.2) { ball.vx += (Math.random() - 0.5) * 200; ball.vy -= 120; ball.still = 0; }
    if (ball.age > 20) ball.done = true;
  }
  b.balls = b.balls.filter(x => !x.done);
}
function dropBall(b, x) { if (b.balls.length < MAX_BALLS) b.balls.push({ x, y:24, vx:(Math.random()-0.5)*30, vy:0, age:0, still:0, done:false }); }

function hitCircle(ball, cx, cy, r, rest, kick) {
  const dx = ball.x - cx, dy = ball.y - cy, d2 = dx*dx + dy*dy, rr = r + BALL_R;
  if (d2 >= rr*rr) return false;
  const d = Math.sqrt(d2) || 0.01, nx = dx/d, ny = dy/d;
  ball.x = cx + nx*rr; ball.y = cy + ny*rr;
  const vn = ball.vx*nx + ball.vy*ny;
  if (vn < 0) { ball.vx -= (1 + rest) * vn * nx; ball.vy -= (1 + rest) * vn * ny; }
  if (kick) { ball.vx += nx * kick; ball.vy += ny * kick; }
  ball.vx += (Math.random() - 0.5) * 18;
  return true;
}
function hitSeg(ball, ax, ay, bx, by, thick, rest, svx = 0, svy = 0) {
  const ex = bx - ax, ey = by - ay, L2 = ex*ex + ey*ey;
  let t = L2 ? ((ball.x - ax)*ex + (ball.y - ay)*ey) / L2 : 0; t = Math.max(0, Math.min(1, t));
  const px = ax + ex*t, py = ay + ey*t, dx = ball.x - px, dy = ball.y - py, d2 = dx*dx + dy*dy, rr = thick + BALL_R;
  if (d2 >= rr*rr) return false;
  const d = Math.sqrt(d2) || 0.01, nx = dx/d, ny = dy/d;
  ball.x = px + nx*rr; ball.y = py + ny*rr;
  let rvx = ball.vx - svx, rvy = ball.vy - svy; const vn = rvx*nx + rvy*ny;
  if (vn < 0) { rvx -= (1 + rest) * vn * nx; rvy -= (1 + rest) * vn * ny; }
  ball.vx = rvx + svx; ball.vy = rvy + svy;
  return true;
}
let lastTick = 0;
function tickSound(b, f) { const now = performance.now(); if (b.team === ME && now - lastTick > 55) { lastTick = now; beep(f, 0.025, 'sine', 0, 0.03); } }
function stepBall(b, ball, h) {
  const C = b.course;
  ball.vy += 760 * h; ball.x += ball.vx * h; ball.y += ball.vy * h;
  if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx) * 0.5; }
  if (ball.x > BW - BALL_R) { ball.x = BW - BALL_R; ball.vx = -Math.abs(ball.vx) * 0.5; }
  for (const p of C.pegs) if (hitCircle(ball, p.x, p.y, 3.5, 0.45)) tickSound(b, 1300);
  for (const bu of C.bumpers) if (hitCircle(ball, bu.x, bu.y, bu.r, 0.6, 170)) { bu.f = 1; tickSound(b, 520); }
  for (const w of C.walls) hitSeg(ball, w[0], w[1], w[2], w[3], 2.5, 0.3);
  for (const w of C.wheels) {
    hitCircle(ball, w.x, w.y, w.hub, 0.4);
    for (let k = 0; k < w.n; k++) {
      const a = w.a + k / w.n * Math.PI * 2, tx = w.x + Math.cos(a) * w.len, ty = w.y + Math.sin(a) * w.len;
      // surface velocity at the ball's nearby point (omega x r)
      const rx = ball.x - w.x, ry = ball.y - w.y;
      if (hitSeg(ball, w.x, w.y, tx, ty, 2.5, 0.35, -w.w * ry, w.w * rx)) tickSound(b, 900);
    }
  }
  const S = C.slider; hitSeg(ball, S.x - S.len/2, S.y, S.x + S.len/2, S.y, 4, 0.5, S.vx, 0);
  if (ball.y > SLOT_TOP) for (let i = 1; i < SLOTS.length; i++) hitSeg(ball, i * SLOT_W, SLOT_TOP, i * SLOT_W, SLOT_BOT + 10, 1.5, 0.3);
  const sp = Math.hypot(ball.vx, ball.vy); if (sp > 520) { ball.vx *= 520/sp; ball.vy *= 520/sp; }
  if (ball.y > SLOT_BOT - BALL_R) { ball.done = true; trigger(b, Math.max(0, Math.min(SLOTS.length - 1, Math.floor(ball.x / SLOT_W)))); }
}

// ----- battlefield objects -----
function moveObjects(dt) {
  for (const o of objs) {
    o.ang += o.spin * dt; o.hit = Math.max(0, o.hit - dt * 4);
    const t = gameT * (o.freq || 1) + o.phase;
    o.x = o.bx; o.y = o.by;
    if (o.motion === 'bob') o.y = o.by + Math.sin(t) * o.amp;
    if (o.motion === 'slide') o.y = o.by + Math.sin(t) * o.amp;
    if (o.motion === 'circle') { o.x = o.bx + Math.cos(t) * o.amp; o.y = o.by + Math.sin(t) * o.amp; }
  }
}
function enemyPieces(team) {
  const out = [];
  for (const o of objs) if (o.alive && o.team !== team) for (const p of o.pieces) if (p.alive) out.push({ o, p });
  return out;
}
function randomTarget(team) { const e = enemyPieces(team); return e.length ? e[Math.floor(Math.random() * e.length)] : null; }

function launchPoint(team) { return { x: team === ME ? BW + 4 : W - BW - 4, y: SLOT_TOP + 30 }; }
function fire(team, kind, opts = {}) {
  const tg = opts.target || randomTarget(team); if (!tg) return;
  const lp = launchPoint(team);
  const speed = { pew:640, rocket:360, bomb:250, nuke:170 }[kind];
  const R = { pew:0, rocket:12, bomb:22, nuke:48 }[kind];
  const tp = piecePos(tg.o, tg.p);
  const a = Math.atan2(tp.y - lp.y, tp.x - lp.x) + (kind === 'rocket' ? (Math.random() - 0.5) * 1.6 : 0);
  shots.push({ team, kind, R, x:lp.x, y:lp.y, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, speed, tg, delay: opts.delay || 0, age:0 });
}
function updateShots(dt) {
  for (const s of shots) {
    if (s.delay > 0) { s.delay -= dt; continue; }
    s.age += dt;
    if (!s.tg || !s.tg.p.alive) s.tg = randomTarget(s.team);
    if (s.tg && s.kind !== 'pew') { // gently home in on a moving target
      const tp = piecePos(s.tg.o, s.tg.p), want = Math.atan2(tp.y - s.y, tp.x - s.x), cur = Math.atan2(s.vy, s.vx);
      let d = want - cur; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI;
      const turn = (s.kind === 'rocket' ? 5 : 2.2) * dt, na = cur + Math.max(-turn, Math.min(turn, d));
      s.vx = Math.cos(na) * s.speed; s.vy = Math.sin(na) * s.speed;
    }
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.kind === 'rocket' && Math.random() < 0.6) particles.push({ x:s.x, y:s.y, vx:0, vy:0, life:0.3, color:'#fbbf24', sz:3 });
    if (s.x < FX0 - 40 || s.x > FX1 + 40 || s.y < -40 || s.y > H + 40 || s.age > 6) { s.done = true; continue; }
    // hit test vs enemy pieces
    const hr = s.kind === 'nuke' ? 12 : s.kind === 'bomb' ? 8 : 5;
    let hit = false;
    for (const o of objs) { if (!o.alive || o.team === s.team) continue;
      for (const p of o.pieces) { if (!p.alive) continue; const q = piecePos(o, p);
        if ((q.x - s.x)**2 + (q.y - s.y)**2 < (hr + PIECE/2)**2) { hit = true; if (s.kind === 'pew') breakPiece(o, p, s.vx, s.vy); break; } }
      if (hit) break; }
    if (hit) { s.done = true; explode(s); }
  }
  shots = shots.filter(s => !s.done);
}
function breakPiece(o, p, vx = 0, vy = 0) {
  if (!p.alive) return;
  p.alive = false; o.hit = 1;
  const q = piecePos(o, p), col = teamColor[o.team];
  debris.push({ x:q.x, y:q.y, vx: vx*0.15 + (Math.random()-0.5)*120, vy: vy*0.15 - 60 - Math.random()*120, rot:o.ang, vr:(Math.random()-0.5)*14, life:1.4, color:col.c, edge:col.d });
  if (!o.pieces.some(pp => pp.alive)) {
    o.alive = false;
    burst(o.x, o.y, col.c, 40, 3);
    popups.push({ x:o.x, y:o.y - 20, text:'DESTROYED!', color:col.l, life:1.3, big:true });
    beep(o.team === ME ? 200 : 700, 0.15, 'square', 0, 0.08); beep(o.team === ME ? 120 : 1000, 0.25, 'square', 0.12, 0.08);
  }
}
function explode(s) {
  const c = teamColor[s.team].c;
  if (s.R > 0) {
    for (const o of objs) { if (!o.alive || o.team === s.team) continue;
      for (const p of o.pieces) { if (!p.alive) continue; const q = piecePos(o, p);
        const dx = q.x - s.x, dy = q.y - s.y, d = Math.hypot(dx, dy);
        if (d < s.R) breakPiece(o, p, dx / (d || 1) * 500, dy / (d || 1) * 500); } }
  }
  if (s.kind === 'nuke') { burst(s.x, s.y, c, 110, 7); shake = 14; flash = 1; noise(1.0, 0.35, 500); beep(55, 0.8, 'sine', 0, 0.3);
    beams.push({ ring:true, x:s.x, y:s.y, R:s.R, life:0.5, team:s.team }); }
  else if (s.kind === 'bomb') { burst(s.x, s.y, c, 45, 4); shake = Math.max(shake, 7); noise(0.45, 0.2, 900);
    beams.push({ ring:true, x:s.x, y:s.y, R:s.R, life:0.35, team:s.team }); }
  else if (s.kind === 'rocket') { burst(s.x, s.y, c, 16, 2); shake = Math.max(shake, 2.5); noise(0.18, 0.09, 1600); }
  else { burst(s.x, s.y, '#fff', 6, 1); beep(s.team === ME ? 950 : 420, 0.03, 'square', 0, 0.03); }
}
function laser(team) {
  const tg = randomTarget(team); if (!tg) return;
  const y = piecePos(tg.o, tg.p).y, dir = team === ME ? 1 : -1;
  const list = [];
  for (const o of objs) { if (!o.alive || o.team === team) continue;
    for (const p of o.pieces) { if (!p.alive) continue; const q = piecePos(o, p); if (Math.abs(q.y - y) < 11) list.push({ o, p, x:q.x }); } }
  list.sort((a, b) => (a.x - b.x) * dir);
  list.slice(0, 10).forEach(h => breakPiece(h.o, h.p, dir * 400, 0));
  beams.push({ team, y, x0: team === ME ? BW : W - BW, x1: team === ME ? W - BW : BW, life:0.5 });
  shake = Math.max(shake, 6); noise(0.4, 0.14, 2400); beep(team === ME ? 1800 : 1400, 0.3, 'sawtooth', 0, 0.04);
}
function trigger(b, slot) {
  const S = SLOTS[slot], team = b.team, mine = team === ME;
  b.slotFlash[slot] = 1;
  popups.push({ x: b.ox + Math.max(40, Math.min(BW - 40, (slot + 0.5) * SLOT_W)), y: SLOT_TOP - 14 - (popups.length % 3) * 13, text:S.name, color:SIZE_COL[S.size], life:1, big:S.size === 'L' });
  switch (S.k) {
    case 'pew': for (let i = 0; i < 4; i++) fire(team, 'pew', { delay:i * 0.1 }); if (mine) beep(1500, 0.06, 'square', 0, 0.05); break;
    case 'rockets': for (let i = 0; i < 5; i++) fire(team, 'rocket', { delay:i * 0.13 }); if (mine) beep(600, 0.2, 'sawtooth', 0, 0.05); break;
    case 'bomb': fire(team, 'bomb'); if (mine) beep(220, 0.15, 'triangle'); break;
    case 'nuke': { // aim the nuke at the biggest remaining enemy object
      let best = null, bn = 0;
      for (const o of objs) if (o.alive && o.team !== team) { const n = o.pieces.filter(p => p.alive).length; if (n > bn) { bn = n; best = o; } }
      if (best) { const p = best.pieces.find(p => p.alive); fire(team, 'nuke', { target:{ o:best, p } }); }
      if (mine) beep(150, 0.4, 'sawtooth', 0, 0.08); break; }
    case 'laser': laser(team); break;
    case 'double': dropBall(b, 20 + Math.random() * (BW - 40)); dropBall(b, 20 + Math.random() * (BW - 40));
      if (mine) { beep(700, 0.08, 'triangle'); beep(1050, 0.12, 'triangle', 0.07); } break;
  }
}

function endGame(winner) {
  running = false;
  const win = winner === ME;
  $('resultTitle').textContent = win ? 'YOU WIN!' : teamColor[AI].name.toUpperCase() + ' WINS';
  $('resultTitle').style.color = teamColor[winner].c;
  const left = objs.filter(o => o.team === winner && o.alive).length;
  $('resultSub').textContent = win ? `All ${teamColor[AI].name} objects destroyed! You had ${left} left.` : `${teamColor[AI].name} still had ${left} left. Try again!`;
  if (win) { fanfare(); for (let i = 0; i < 180; i++) confetti.push(makeConfetti()); }
  else { beep(300, 0.2, 'sawtooth'); beep(220, 0.35, 'sawtooth', 0.2); }
  setTimeout(() => $('result').classList.remove('hidden'), 1300);
  requestAnimationFrame(loop);
}

// ===== effects =====
function burst(x, y, color, n, power = 1) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = (40 + Math.random() * 120) * power;
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.35 + Math.random()*0.4, color: Math.random() < 0.3 ? '#fff' : color, sz:4 }); }
  if (particles.length > 1200) particles.splice(0, particles.length - 1200);
}
function makeConfetti() {
  const cols = [teamColor[ME].c, '#fff', '#facc15', teamColor[ME].l];
  return { x:Math.random()*W, y:-Math.random()*250, vx:(Math.random()-0.5)*80, vy:110 + Math.random()*150, rot:Math.random()*6, vr:(Math.random()-0.5)*10, color:cols[Math.floor(Math.random()*cols.length)], life:5 };
}
function updateFx(dt) {
  for (const p of particles) { p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.9; p.vy *= 0.9; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const d of debris) { d.vy += 650 * dt; d.x += d.vx*dt; d.y += d.vy*dt; d.rot += d.vr*dt; d.life -= dt; }
  debris = debris.filter(d => d.life > 0 && d.y < H + 20);
  for (const p of popups) { p.y -= 28 * dt; p.life -= dt * 1.1; }
  popups = popups.filter(p => p.life > 0);
  for (const c of confetti) { c.x += c.vx*dt; c.y += c.vy*dt; c.rot += c.vr*dt; c.life -= dt; }
  confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
  if (!running) for (const bm of beams) bm.life -= dt;
}

// ===== drawing =====
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = vw * dpr; cv.height = vh * dpr;
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2; offY = (vh - H * scale) / 2;
  checkOrientation();
}
function checkOrientation() {
  const portrait = window.innerHeight > window.innerWidth * 1.05;
  $('rotate').classList.toggle('hidden', !portrait || ignorePortrait);
}
window.addEventListener('resize', () => { resize(); draw(); });

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function line(ax, ay, bx, by) { ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); }

function drawBoard(b) {
  const col = teamColor[b.team], C = b.course;
  ctx.save(); ctx.translate(b.ox, 0);
  rr(0, 0, BW, BH, 12); ctx.fillStyle = '#151936'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = col.c; ctx.stroke();
  ctx.save(); rr(0, 0, BW, BH, 12); ctx.clip();
  ctx.fillStyle = col.d; ctx.fillRect(0, 0, BW, 30);
  // dropper
  ctx.fillStyle = col.c; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(b.dropX - 12, 6); ctx.lineTo(b.dropX + 12, 6); ctx.lineTo(b.dropX, 24); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.lineCap = 'round';
  // funnels / ramps
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 5;
  for (const w of C.walls) line(w[0], w[1], w[2], w[3]);
  // pegs
  ctx.fillStyle = '#cbd5e1'; for (const p of C.pegs) { ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI*2); ctx.fill(); }
  // bumpers
  for (const bu of C.bumpers) {
    ctx.beginPath(); ctx.arc(bu.x, bu.y, bu.r + bu.f * 3, 0, Math.PI*2);
    ctx.fillStyle = bu.f > 0.1 ? '#fff' : '#fbbf24'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#b45309'; ctx.stroke();
    ctx.beginPath(); ctx.arc(bu.x, bu.y, bu.r * 0.45, 0, Math.PI*2); ctx.fillStyle = '#b45309'; ctx.fill();
  }
  // prong wheels
  for (const w of C.wheels) {
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 5;
    for (let k = 0; k < w.n; k++) { const a = w.a + k / w.n * Math.PI*2; line(w.x, w.y, w.x + Math.cos(a)*w.len, w.y + Math.sin(a)*w.len); }
    ctx.fillStyle = col.c; ctx.beginPath(); ctx.arc(w.x, w.y, w.hub, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  // slider
  const S = C.slider; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 8; line(S.x - S.len/2, S.y, S.x + S.len/2, S.y);
  ctx.lineCap = 'butt';
  // slots
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < SLOTS.length; i++) {
    const s = SLOTS[i], x = i * SLOT_W, f = b.slotFlash[i];
    ctx.globalAlpha = 0.5 + f * 0.5; ctx.fillStyle = SIZE_COL[s.size]; ctx.fillRect(x + 1, SLOT_TOP, SLOT_W - 2, BH - SLOT_TOP); ctx.globalAlpha = 1;
    ctx.font = (s.k === 'double' ? 13 : 18) * (1 + f * 0.35) + 'px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
    ctx.fillStyle = '#fff'; ctx.fillText(s.icon, x + SLOT_W/2, SLOT_TOP + 24);
    ctx.font = '800 10px "Baloo 2", system-ui'; ctx.fillText(SIZE_TXT[s.size], x + SLOT_W/2, SLOT_TOP + 52);
    if (i > 0) { ctx.fillStyle = '#e2e8f0'; ctx.fillRect(x - 1.5, SLOT_TOP, 3, BH - SLOT_TOP); }
  }
  // balls
  for (const ball of b.balls) { ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fillStyle = col.c; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#fff'; ctx.stroke(); }
  ctx.restore(); ctx.restore();
}

function drawPieceSquare(x, y, ang, col, edge, hit) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = hit ? '#fff' : col; ctx.fillRect(-PIECE/2, -PIECE/2, PIECE, PIECE);
  ctx.lineWidth = 1.5; ctx.strokeStyle = edge; ctx.strokeRect(-PIECE/2, -PIECE/2, PIECE, PIECE);
  ctx.restore();
}

function drawField() {
  rr(FX0, 0, FX1 - FX0, H, 14); ctx.fillStyle = '#0f1430'; ctx.fill();
  ctx.save(); rr(FX0, 0, FX1 - FX0, H, 14); ctx.clip();
  // team-tinted halves
  ctx.globalAlpha = 0.10; ctx.fillStyle = teamColor[ME].c; ctx.fillRect(FX0, 0, FC - FX0, H);
  ctx.fillStyle = teamColor[AI].c; ctx.fillRect(FC, 0, FX1 - FC, H); ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
  for (let x = FX0; x < FX1; x += 24) line(x, 0, x, H);
  for (let y = 0; y < H; y += 24) line(FX0, y, FX1, y);
  ctx.setLineDash([8, 8]); ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; line(FC, 40, FC, H); ctx.setLineDash([]);
  // objects
  for (const o of objs) {
    if (!o.alive) continue;
    const col = teamColor[o.team];
    // connecting "skeleton" so objects read as one thing
    if (o.spin) { ctx.strokeStyle = col.d; ctx.lineWidth = 3; for (const p of o.pieces) if (p.alive) { const q = piecePos(o, p); line(o.x, o.y, q.x, q.y); } }
    for (const p of o.pieces) if (p.alive) { const q = piecePos(o, p); drawPieceSquare(q.x, q.y, o.ang, col.c, col.d, o.hit > 0.6); }
  }
  // debris
  for (const d of debris) { ctx.globalAlpha = Math.min(1, d.life); drawPieceSquare(d.x, d.y, d.rot, d.color, d.edge, false); }
  ctx.globalAlpha = 1;
  // beams & blast rings
  for (const bm of beams) {
    const col = teamColor[bm.team];
    ctx.globalAlpha = Math.min(1, bm.life * 3);
    if (bm.ring) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(bm.x, bm.y, bm.R * (1.2 - bm.life), 0, Math.PI*2); ctx.stroke(); }
    else { ctx.fillStyle = '#fff'; ctx.fillRect(Math.min(bm.x0, bm.x1), bm.y - 9, Math.abs(bm.x1 - bm.x0), 18);
      ctx.fillStyle = col.c; ctx.fillRect(Math.min(bm.x0, bm.x1), bm.y - 4, Math.abs(bm.x1 - bm.x0), 8); }
    ctx.globalAlpha = 1;
  }
  // shots
  for (const s of shots) {
    if (s.delay > 0) continue;
    const col = teamColor[s.team], a = Math.atan2(s.vy, s.vx);
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(a);
    if (s.kind === 'pew') { ctx.fillStyle = '#fff'; ctx.fillRect(-7, -2, 14, 4); ctx.fillStyle = col.c; ctx.fillRect(-7, -1, 8, 2); }
    else if (s.kind === 'rocket') { ctx.fillStyle = col.c; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-6, -5); ctx.lineTo(-6, 5); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    else { ctx.rotate(-a); const r = s.kind === 'nuke' ? 14 : 9;
      ctx.fillStyle = '#111'; ctx.strokeStyle = col.c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.font = (s.kind === 'nuke' ? 16 : 11) + 'px system-ui, "Apple Color Emoji", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(s.kind === 'nuke' ? '☢️' : '💣', 0, 1); }
    ctx.restore();
  }
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.sz/2, p.y - p.sz/2, p.sz, p.sz); }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawHud();
}

function drawHud() {
  const half = (FX1 - FX0) / 2 - 18;
  [ME, AI].forEach(team => {
    const col = teamColor[team], frac = countPieces(team) / totals[team], n = objs.filter(o => o.team === team && o.alive).length;
    const x = team === ME ? FX0 + 10 : FC + 8, w = half;
    rr(x, 8, w, 22, 11); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fill();
    const fw = Math.max(0, w * frac);
    if (fw > 2) { rr(team === ME ? x : x + w - fw, 8, fw, 22, 11); ctx.fillStyle = col.c; ctx.fill(); }
    ctx.font = '800 14px "Baloo 2", system-ui'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
    ctx.textAlign = team === ME ? 'left' : 'right';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)';
    const label = (team === ME ? col.name + ' (you)' : col.name) + '  ·  ' + n + ' left';
    const tx = team === ME ? x + 10 : x + w - 10;
    ctx.strokeText(label, tx, 20); ctx.fillText(label, tx, 20);
  });
}

function draw() {
  if (!objs) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0b0e22'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.save(); ctx.translate(offX + sx * scale, offY + sy * scale); ctx.scale(scale, scale);
  drawBoard(boards[ME]); drawBoard(boards[AI]);
  drawField();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.font = `800 ${p.big ? 24 : 17}px "Baloo 2", system-ui`;
    ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color === SIZE_COL.S ? '#86efac' : p.color === SIZE_COL.M ? '#fdba74' : p.color === SIZE_COL.L ? '#fca5a5' : p.color === SIZE_COL.X ? '#c7d2fe' : p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  for (const c of confetti) { ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.fillStyle = c.color; ctx.fillRect(-5, -2.5, 10, 5); ctx.restore(); }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.6})`; ctx.fillRect(-50, -50, W + 100, H + 100); }
  ctx.restore();
}

// ===== sound =====
let ac = null, noiseBuf = null;
function initAudio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e) { ac = null; } }
function beep(freq, dur, type = 'sine', delay = 0, vol = 0.12) {
  if (!ac) return;
  try { const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02); } catch(e) {}
}
function noise(dur, vol, cutoff) {
  if (!ac) return;
  try { if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t0 = ac.currentTime;
    src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = cutoff; g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(ac.destination); src.start(t0); src.stop(t0 + dur); } catch(e) {}
}
function fanfare() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.25, 'triangle', i * 0.12, 0.15)); }

setupGame();
})();
</script>
